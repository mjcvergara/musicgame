<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Galaxy Music Memory</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Galaxy stars -->
    <div class="stars"></div>
    <div class="stars stars-2"></div>
    <div class="stars stars-3"></div>


    <main class="game">

        <div class="logo">
            🎵
        </div>

        <h1>Galaxy Music</h1>

        <p class="subtitle">
            Listen. Remember. Play.
        </p>


        <!-- GAME INFORMATION -->

        <section class="game-info">

            <div class="info-box">

                <span>ROUND</span>

                <strong id="round">
                    0
                </strong>

            </div>


            <div class="info-box">

                <span>SCORE</span>

                <strong id="score">
                    0
                </strong>

            </div>

        </section>


        <!-- MESSAGE -->

        <div class="message-box">

            <p id="message">
                Tap START to begin
            </p>

        </div>


        <!-- PIANO -->

        <section class="piano">

            <button
                class="note"
                data-note="C">
                C
            </button>

            <button
                class="note"
                data-note="D">
                D
            </button>

            <button
                class="note"
                data-note="E">
                E
            </button>

            <button
                class="note"
                data-note="F">
                F
            </button>

            <button
                class="note"
                data-note="G">
                G
            </button>

            <button
                class="note"
                data-note="A">
                A
            </button>

            <button
                class="note"
                data-note="B">
                B
            </button>

        </section>


        <!-- START BUTTON -->

        <button
            id="startButton">

            START GAME

        </button>


        <p class="instructions">

            🎧 Listen to the sequence<br>
            🎹 Repeat the notes<br>
            ✨ Reach the highest score

        </p>

    </main>


    <script src="script.js"></script>

</body>

</html>
