<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#100018"
    >

    <title>Galaxy Music Memory</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =================================
         GALAXY BACKGROUND
    ================================== -->

    <div class="stars"></div>

    <div class="stars stars-2"></div>

    <div class="stars stars-3"></div>


    <!-- =================================
         GAME
    ================================== -->

    <main class="game">

        <!-- Logo -->

        <div class="logo">
            🎵
        </div>


        <!-- Title -->

        <h1>
            Galaxy Music
        </h1>


        <p class="subtitle">
            Listen. Remember. Play.
        </p>


        <!-- =================================
             SCORE / ROUND
        ================================== -->

        <section class="game-info">

            <div class="info-box">

                <span>
                    ROUND
                </span>

                <strong id="round">
                    0
                </strong>

            </div>


            <div class="info-box">

                <span>
                    SCORE
                </span>

                <strong id="score">
                    0
                </strong>

            </div>

        </section>


        <!-- =================================
             MESSAGE
        ================================== -->

        <div class="message-box">

            <p id="message">
                Tap START to begin
            </p>

        </div>


        <!-- =================================
             PIANO
        ================================== -->

        <section
            class="piano"
            aria-label="Piano keys"
        >

            <button
                class="note"
                data-note="C"
                type="button"
            >
                C
            </button>


            <button
                class="note"
                data-note="D"
                type="button"
            >
                D
            </button>


            <button
                class="note"
                data-note="E"
                type="button"
            >
                E
            </button>


            <button
                class="note"
                data-note="F"
                type="button"
            >
                F
            </button>


            <button
                class="note"
                data-note="G"
                type="button"
            >
                G
            </button>


            <button
                class="note"
                data-note="A"
                type="button"
            >
                A
            </button>


            <button
                class="note"
                data-note="B"
                type="button"
            >
                B
            </button>

        </section>


        <!-- =================================
             START BUTTON
        ================================== -->

        <button
            id="startButton"
            type="button"
        >
            START GAME
        </button>


        <!-- =================================
             INSTRUCTIONS
        ================================== -->

        <div class="instructions">

            <p>
                🎧 Listen to the sequence
            </p>

            <p>
                🎹 Repeat the notes
            </p>

            <p>
                ✨ Reach the highest score
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
